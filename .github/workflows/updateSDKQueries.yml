on:
  workflow_dispatch:

name: Update SDK queries
permissions:
  contents: read
  pull-requests: write
jobs:
  updateQueries:
    runs-on: ubuntu-latest
    steps:
      - uses: tibdex/github-app-token@v1
        id: generate-token
        with:
          app_id: ${{ secrets.PR_APP_ID }}
          private_key: ${{ secrets.PR_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          path: graphql-queries
          repository: fragment-dev/graphql-queries
          token: ${{ steps.generate-token.outputs.token }}

      - uses: actions/checkout@v4
        name: Checkout fragment-python
        with:
          path: fragment-python

      - name: Use Python 3.10.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.14'

      - name: Install dependencies
        working-directory: ./fragment-python
        run: |
          pip install poetry
          poetry install --with dev

      - name: Copy queries.graphql
        working-directory: ./fragment-python
        run: |
          mkdir queries
          cp ../graphql-queries/queries.graphql fragment/std_queries/queries.graphql

      # The template Schema is the source of truth the tests build against:
      # schema.json is what they store, and queries.graphql is valid codegen
      # input for the same Schema. Mirrored wholesale rather than file-by-file so
      # that files removed upstream also disappear here. Do not edit the copy in
      # tests/template-schema -- the next sync overwrites it.
      - name: Copy template Schema
        working-directory: ./fragment-python
        run: |
          rm -rf tests/template-schema
          cp -R ../graphql-queries/template-schema tests/template-schema

      # `make snapshots` regenerates tests/snapshots from the queries just
      # copied. Without it the sync PR ships updated queries alongside stale
      # snapshots, and the `snapshots` job in tests.yml fails on every sync.
      # `refresh-snapshot-schema` repins tests/snapshots/schema.graphql to the
      # current API and regenerates. Snapshots are pinned so that unrelated PRs
      # do not fail when the API changes; this sync is where that drift is meant
      # to surface, as a reviewable diff next to the queries it came with.
      - name: Generate SDK
        working-directory: ./fragment-python
        run: |
          make build
          make refresh-snapshot-schema
          make lint

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v4
        with:
          path: ./fragment-python
          token: ${{ steps.generate-token.outputs.token }}
          commit-message: 'Update Python SDK queries'
          title: 'Update Python queries and snapshots'
          base: 'dev'
          branch: update-sdk-queries/${{ github.run_id }}
          body: >
            This PR is auto-generated by github action.
